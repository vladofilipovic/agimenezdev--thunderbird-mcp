[project]
name = "thunderbird-mcp"
version = "0.1.0"
description = "Read-only MCP server over Thunderbird's local mail index (GLODA) — search and read email from any MCP client."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Andres Gimenez" }]
keywords = ["mcp", "model-context-protocol", "thunderbird", "email", "claude", "llm"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Communications :: Email",
]
dependencies = ["mcp[cli]>=1.6.0,<2"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4"]

[project.scripts]
thunderbird-mcp = "thunderbird_mcp.server:main"

[project.urls]
Homepage = "https://github.com/agimenez-dev/thunderbird-mcp"
Issues = "https://github.com/agimenez-dev/thunderbird-mcp/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thunderbird_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
